{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;">
    <title>{% block title %}VoidAuth - The Zero-Knowledge Void{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --void-bg: #050505;
            --void-glass: rgba(255, 255, 255, 0.05);
            --void-accent: #7000ff;
            --void-accent-low: rgba(112, 0, 255, 0.3);
            --void-text: #e0e0e0;
            --void-dim: #888;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--void-bg);
            color: var(--void-text);
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, #1a0033 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, #001a33 0%, transparent 40%);
            min-height: 100vh;
        }

        h1, h2, h3 { font-family: 'Outfit', sans-serif; }

        .glass-panel {
            background: var(--void-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .btn-void {
            background: linear-gradient(135deg, var(--void-accent), #a000ff);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px var(--void-accent-low);
        }

        .btn-void:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--void-accent-low);
            filter: brightness(1.1);
        }

        input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px;
            border-radius: 12px;
            color: white;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--void-accent);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0.5; }
        }

        .pulse-element {
            animation: pulse 4s infinite ease-in-out;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Core Libs -->
    <script src="{% static 'voidauth/js/libsodium.js' %}"></script>
    <script src="{% static 'voidauth/js/bip39.js' %}"></script>
    <script src="{% static 'voidauth/js/voidauth.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
