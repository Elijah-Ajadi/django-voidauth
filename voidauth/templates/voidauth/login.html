{% extends 'voidauth/base.html' %}
{% load voidauth_tags %}

{% block title %}Enter the Void - Login{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 4rem auto;">
    <div class="glass-panel">
        <h1 style="text-align: center; margin-bottom: 1.5rem;">ENTER THE VOID</h1>

        <form id="login-form">
            <input type="text" id="username" name="username" autocomplete="username" placeholder="Username" required>
            <button type="submit" class="btn-void" style="width: 100%;">Authorize Session</button>
        </form>

        <div style="margin-top: 2rem; text-align: center; font-size: 0.9rem;">
            New to the void? <a href="{% url 'voidauth:register' %}" style="color: var(--void-accent); text-decoration: none;">Create Identity</a>
        </div>
    </div>
</div>

{% void_recovery_form %}

{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('login-form').onsubmit = async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        btn.textContent = "VERIFYING...";

        try {
            const response = await VoidAuth.login(username);
            if (response.status === 'success') {
                window.location.href = "/";
            } else {
                alert("Auth Failed: " + response.message);
                btn.disabled = false;
                btn.textContent = "Authorize Session";
            }
        } catch (error) {
            alert("Security Error: " + error.message);
            btn.disabled = false;
            btn.textContent = "Authorize Session";
        }
    };
</script>
{% endblock %}
