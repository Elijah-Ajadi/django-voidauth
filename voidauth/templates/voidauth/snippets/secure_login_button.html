<button type="button" id="void-secure-login-btn" 
        class="void-btn-primary w-full px-4 py-2.5 rounded-full bg-black text-primary border border-primary/30 font-bold text-sm hover:bg-primary/10 transition-all flex items-center justify-center gap-2"
        data-redirect="{{ redirect_url|default:'/' }}">
    <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
    Secure Login (Vault)
</button>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('void-secure-login-btn');
    if (!btn) return;

    btn.addEventListener('click', async () => {
        const form = btn.closest('form');
        const identifierField = form ? form.querySelector('[name="username"], [name="email"]') : null;
        const identifier = identifierField ? identifierField.value : '';

        if (!identifier) {
            alert('Please enter your username or email first.');
            return;
        }

        const originalHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = 'Processing...';

        try {
            const success = await VoidAuth.login(identifier);
            if (success) {
                window.location.href = btn.dataset.redirect;
            }
        } catch (err) {
            alert('Secure Login Failed: ' + err.message);
            btn.disabled = false;
            btn.innerHTML = originalHtml;
        }
    });
});
</script>
